[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodulation"
dynamic = ["version"]
description = "PyModulation library"
readme = "README.md"
license = { text = "LGPL-3.0-only" }
authors = [
    { name = "Gabriel Mariano Marcelino", email = "contact@gabrielmm.com" },
]
maintainers = [
    { name = "Gabriel Mariano Marcelino", email = "contact@gabrielmm.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest", "numpy"]
examples = ["numpy", "matplotlib"]
docs = ["Sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/pymodulation/pymodulation"
Documentation = "https://pymodulation.github.io/pymodulation/"
Download = "https://github.com/pymodulation/pymodulation/releases"

[tool.setuptools.packages.find]
include = ["pymodulation", "pymodulation.*"]

[tool.setuptools.dynamic]
version = { attr = "pymodulation.version.__version__" }
